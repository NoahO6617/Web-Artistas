@if (item().type === 'release') {
  <div class="music-card static-card">
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </div>
} @else {
  <a class="music-card" href="#" (click)="selectItem($event)">
    <ng-container *ngTemplateOutlet="cardContent"></ng-container>
  </a>
}

<ng-template #cardContent>
  <div class="cover">
    @if (item().image) {
      <img
        [src]="item().image"
        [alt]="item().title"
        loading="lazy"
      />
    } @else {
      <div class="placeholder">
        @if (item().type === 'track') { <span></span> }
        @if (item().type === 'artist') { <span></span> }
        @if (item().type === 'release') { <span></span> }
      </div>
    }
  </div>

  <div class="info">
    <span class="type">{{ typeLabel }}</span>
    <h3>{{ item().title }}</h3>
    <p>{{ item().subtitle }}</p>
    @if (item().year) {
      <p class="year">{{ item().year }}</p>
    }
  </div>
</ng-template>
